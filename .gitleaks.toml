# gitleaks config for the export gate.
#
# Extends the default ruleset — it does not replace it. The only additions are
# allowlists for findings verified as false positives, each scoped as tightly as
# the finding allows so the rule keeps working everywhere else.

[extend]
useDefault = true

[[rules]]
id = "generic-api-key"
description = "Generic API Key"
regex = '''(?i)(?:key|api|token|secret|client|passwd|password|auth|access)(?:[0-9a-z\-_\t .]{0,20})(?:[\s|']|[\s|"]){0,3}(?:=|>|:{1,3}=|\|\||:|<=|=>|:=|\?=|,)(?:'|\"|\s|=|\x60){0,5}([0-9a-z\-_.=]{10,150})(?:['|\"|\n|\r|\s|\x60|;|\\]|$)'''
keywords = ["key", "api", "token", "secret", "client", "passwd", "password", "auth", "access"]

  [rules.allowlist]
  # Enonic's own API documentation uses content and node UUIDs in every example
  # (`content.get({ key: '<uuid>' })`). They identify sample content in a doc
  # build, not a credential, and the docs are vendored verbatim so they cannot
  # be edited to avoid the pattern. Verified by inspection.
  description = "Enonic doc example content/node UUIDs"
  paths = ['''core/kb/offline-reference/(xp7|xp8|react4xp-.*|content-studio-.*)/.*\.md$''']
  regexes = ['''^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$''']
