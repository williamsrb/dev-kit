# Absolute quality floor per role, the same for every vendor. A number is a fraction of
# the frontier (best measured consolidated score, Terminal-Bench 4.0 points). `tie` means
# within tie_sigma of the frontier's standard error. A config passes when its score
# minus one standard error clears the floor.
tie_sigma: 2
quality-gate: tie
task-owner: 0.85
implement: 0.75
explore: 0.45
follow: 0.45
deterministic: 0.20
